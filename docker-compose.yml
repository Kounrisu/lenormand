services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lenormand
      POSTGRES_USER: lenormand
      POSTGRES_PASSWORD: lenormand
    ports:
      - "5432:5432"
    volumes:
      - lenormand-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lenormand"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgres://lenormand:lenormand@postgres:5432/lenormand
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  lenormand-postgres-data:
