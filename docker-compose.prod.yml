services:
  postgres:
    image: postgres:16-alpine
    container_name: lenormand-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - lenormand-postgres-data:/var/lib/postgresql/data
    networks:
      - web
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: lenormand-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CORS_ALLOWED_ORIGINS: https://lenormand.sn8w.com
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - web

networks:
  web:
    external: true

volumes:
  lenormand-postgres-data:
