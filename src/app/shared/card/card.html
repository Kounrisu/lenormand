<div class="card" [class.card--flipped]="!faceDown()" [class.card--highlighted]="highlighted()">
  <div class="card__inner">
    <div class="card__face card__face--back">
      <img class="card__art" [src]="backSrc()" alt="" draggable="false" />
    </div>
    <div class="card__face card__face--front">
      <img
        class="card__art"
        [src]="'cards/' + card().slug + '.jpg'"
        [alt]="card().name"
        draggable="false"
      />
    </div>
  </div>
</div>
