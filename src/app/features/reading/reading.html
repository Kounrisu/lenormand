<div class="reading">
  @if (question()) {
    <p class="reading__question">{{ question() }}</p>
  }

  @if (draw().atCut) {
    <p class="reading__hint">At the cut</p>
    <div class="reading__cut">
      <app-card [card]="draw().cutCard" [highlighted]="true" />
    </div>
  } @else {
    <p class="reading__cut-note">The cut was the {{ draw().cutCard.name }}.</p>

    <div class="pit">
      <div class="stock" aria-hidden="true">
        @for (i of stockLayers; track i) {
          <span class="stock__layer card-back" [style.--i]="i"></span>
        }
      </div>

      <div class="tableau">
        @for (card of firstThirteen(); track card.number; let i = $index) {
          @if (i < revealedCount()) {
            <div class="tableau__slot" [class.tableau__slot--in]="true">
              <app-card
                [card]="card"
                [highlighted]="card.number === ringNumber"
              />
            </div>
          }
        }
      </div>
    </div>

    @if (!done()) {
      <p class="reading__hint">
        Dealing
        <button type="button" class="reading__skip" (click)="skipToEnd()">Turn them all</button>
      </p>
    }
  }
</div>
