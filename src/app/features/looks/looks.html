<div class="looks">
  <h2>Settings</h2>
  <p class="looks__lede">The back of the pack, the faces, and the cloth they sit on.</p>

  <h3>Card backs</h3>
  <div class="looks__row" role="radiogroup" aria-label="Card back">
    @for (pack of theme.backs; track pack.id) {
      <button
        type="button"
        class="looks__pack"
        role="radio"
        [attr.aria-checked]="theme.back().id === pack.id"
        [class.looks__pack--on]="theme.back().id === pack.id"
        (click)="theme.pickBack(pack.id)"
      >
        <span class="looks__pack-face" [style.background-image]="'url(' + pack.src + ')'"></span>
        {{ pack.label }}
      </button>
    }
  </div>

  <h3>Card faces</h3>
  <div class="looks__row" role="radiogroup" aria-label="Card faces">
    <button type="button" class="looks__pack looks__pack--on" role="radio" aria-checked="true">
      <span
        class="looks__pack-face looks__pack-face--front"
        [style.background-image]="'url(' + theme.face().src + ')'"
      ></span>
      {{ theme.face().label }}
    </button>
    <span class="looks__soon">
      <span class="looks__soon-face">?</span>
      More later
    </span>
  </div>

  <h3>Cloth</h3>
  <div class="looks__row" role="radiogroup" aria-label="Cloth">
    @for (cloth of theme.cloths; track cloth.id) {
      <button
        type="button"
        class="looks__swatch"
        role="radio"
        [attr.aria-checked]="theme.cloth().id === cloth.id"
        [class.looks__swatch--on]="theme.cloth().id === cloth.id"
        [style.background-image]="'url(' + cloth.src + ')'"
        (click)="theme.pickCloth(cloth.id)"
      >
        {{ cloth.label }}
      </button>
    }
  </div>

  @if (!pack.isFactory()) {
    <button type="button" class="looks__deed" (click)="freshPack()">New pack</button>
  }
  <button type="button" class="btn btn--primary" (click)="back.emit()">Back to the table</button>
</div>
